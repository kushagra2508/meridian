[project]
name = "meridian-crew"
version = "0.1.0"
description = "CrewAI Meridian desk: Feasibility, Statute, Channel, Reframe and Shared agents"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai==1.15.14",
    "numpy-financial==1.0.0",
    "requests>=2.32",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
meridian = "meridian_crew.__main__:main"
feasibility = "meridian_crew.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/meridian_crew"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# A bare `pytest` stays fast and free. `-m live` on the command line overrides this.
addopts = "-q -m 'not live and not network'"
markers = [
    "live: hits a real LLM endpoint; requires OPENROUTER_API_KEY",
    "network: hits the public mfapi.in endpoint",
]
